# Copiar este archivo como secrets.toml y reemplazar cada hash con el que
# entrega:  python generar_clave.py
# secrets.toml NUNCA se sube a un repositorio ni se comparte.
#
# rol = "gerencia"     -> ve solo el tablero de Gerencia
# rol = "operaciones"  -> ve solo el tablero de Operaciones

[usuarios.gerencia]
nombre = "Gerencia"
rol = "gerencia"
clave_hash = "PEGAR_AQUI_EL_HASH"

[usuarios.jefe_operaciones]
nombre = "Jefe de Operaciones"
rol = "operaciones"
clave_hash = "PEGAR_AQUI_EL_HASH"

[usuarios.asistente_operaciones]
nombre = "Asistente de Operaciones"
rol = "operaciones"
clave_hash = "PEGAR_AQUI_EL_HASH"
